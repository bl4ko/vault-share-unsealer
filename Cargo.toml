[package]
name = "vault-share-unsealer"
version = "0.1.0"
edition = "2024"
description = "Unseal HashiCorp Vault from Shamir key shares spread across hosts"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/bl4ko/vault-share-unsealer"
readme = "README.md"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "signal"] }
toml = "1.1.8"
webpki-roots = "1.0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
