name: Release assets
on:
  push:
    tags: ["v*"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: vault-share-unsealer-runner
    timeout-minutes: 30
    container:
      image: rust:1.100.0-trixie@sha256:e19840879045c951c905d0eaa9887f3439c62000e429963371b376bac8d38c31
    env:
      CARGO_HOME: /tmp/cargo
      HOME: /tmp
      XDG_CACHE_HOME: /__w/_temp/.cache
      ZIG_VERSION: 0.16.0
      ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      CARGO_ZIGBUILD_VERSION: 0.23.4
      CARGO_ZIGBUILD_SHA256: 9e3cf73485edbd45905c8aadbc0fdf869c7ddc3848f0c898229f2680db52e44b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install zig and cargo-zigbuild
        run: |
          set -eu
          mkdir -p /__w/_temp/tools/bin
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o /__w/_temp/tools/zig.tar.xz
          echo "$ZIG_SHA256  /__w/_temp/tools/zig.tar.xz" | sha256sum -c -
          tar -xJf /__w/_temp/tools/zig.tar.xz -C /__w/_temp/tools
          ln -s "/__w/_temp/tools/zig-x86_64-linux-$ZIG_VERSION/zig" /__w/_temp/tools/bin/zig
          curl -fsSL "https://github.com/rust-cross/cargo-zigbuild/releases/download/v$CARGO_ZIGBUILD_VERSION/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz" -o /__w/_temp/tools/cargo-zigbuild.tar.xz
          echo "$CARGO_ZIGBUILD_SHA256  /__w/_temp/tools/cargo-zigbuild.tar.xz" | sha256sum -c -
          tar -xJf /__w/_temp/tools/cargo-zigbuild.tar.xz -C /__w/_temp/tools/bin --strip-components=1 cargo-zigbuild-x86_64-unknown-linux-musl/cargo-zigbuild
          echo /__w/_temp/tools/bin >> "$GITHUB_PATH"
      - run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - name: Build
        run: |
          export VSU_VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/dist
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo zigbuild --locked --release -j 2 --target "$target"
            cp "target/$target/release/vault-share-unsealer" "/tmp/dist/vault-share-unsealer-$target"
          done
          cd /tmp/dist
          for f in vault-share-unsealer-*; do sha256sum "$f" > "$f.sha256"; done
          cat ./*.sha256
          "./vault-share-unsealer-x86_64-unknown-linux-musl" --version | grep -qx "vault-share-unsealer $VSU_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: /tmp/dist
          retention-days: 1
  upload:
    name: Upload
    needs: build
    runs-on: vault-share-unsealer-runner
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    container:
      image: rust:1.100.0-trixie@sha256:e19840879045c951c905d0eaa9887f3439c62000e429963371b376bac8d38c31
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: /tmp/dist
      - run: cd /tmp/dist && sha256sum -c ./*.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: /tmp/dist/vault-share-unsealer-*-musl
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth="Authorization: Bearer $GH_TOKEN"
          id=""
          for _ in $(seq 1 20); do
            id=$(curl -fsS -H "$auth" "$api/releases/tags/$GITHUB_REF_NAME" 2>/dev/null | sed -n 's/^  "id": \([0-9]*\),$/\1/p' | head -1)
            [ -n "$id" ] && break
            sleep 15
          done
          [ -n "$id" ] || { echo "release $GITHUB_REF_NAME not found" >&2; exit 1; }
          for f in /tmp/dist/*; do
            name=$(basename "$f")
            curl -fsS -o /dev/null -X POST -H "$auth" -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$name"
            echo "uploaded $name"
          done
