name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    name: Check
    runs-on: vault-share-unsealer-runner
    timeout-minutes: 30
    container:
      image: rust:1.100.0-trixie@sha256:e19840879045c951c905d0eaa9887f3439c62000e429963371b376bac8d38c31
    env:
      CARGO_HOME: /tmp/cargo
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  musl:
    name: Musl build
    runs-on: vault-share-unsealer-runner
    timeout-minutes: 30
    container:
      image: rust:1.100.0-trixie@sha256:e19840879045c951c905d0eaa9887f3439c62000e429963371b376bac8d38c31
    env:
      CARGO_HOME: /tmp/cargo
      HOME: /tmp
      XDG_CACHE_HOME: /__w/_temp/.cache
      ZIG_VERSION: 0.16.0
      ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      CARGO_ZIGBUILD_VERSION: 0.23.4
      CARGO_ZIGBUILD_SHA256: 9e3cf73485edbd45905c8aadbc0fdf869c7ddc3848f0c898229f2680db52e44b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install zig and cargo-zigbuild
        run: |
          set -eu
          mkdir -p /__w/_temp/tools/bin
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o /__w/_temp/tools/zig.tar.xz
          echo "$ZIG_SHA256  /__w/_temp/tools/zig.tar.xz" | sha256sum -c -
          tar -xJf /__w/_temp/tools/zig.tar.xz -C /__w/_temp/tools
          ln -s "/__w/_temp/tools/zig-x86_64-linux-$ZIG_VERSION/zig" /__w/_temp/tools/bin/zig
          curl -fsSL "https://github.com/rust-cross/cargo-zigbuild/releases/download/v$CARGO_ZIGBUILD_VERSION/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz" -o /__w/_temp/tools/cargo-zigbuild.tar.xz
          echo "$CARGO_ZIGBUILD_SHA256  /__w/_temp/tools/cargo-zigbuild.tar.xz" | sha256sum -c -
          tar -xJf /__w/_temp/tools/cargo-zigbuild.tar.xz -C /__w/_temp/tools/bin --strip-components=1 cargo-zigbuild-x86_64-unknown-linux-musl/cargo-zigbuild
          echo /__w/_temp/tools/bin >> "$GITHUB_PATH"
      - run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - run: cargo zigbuild --locked --release -j 2 --target x86_64-unknown-linux-musl
      - run: cargo zigbuild --locked --release -j 2 --target aarch64-unknown-linux-musl
      - run: |
          mkdir -p /tmp/it
          cp target/x86_64-unknown-linux-musl/release/vault-share-unsealer /tmp/it/
          sh tests/gen-certs.sh /tmp/it/certs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration
          path: /tmp/it
          retention-days: 1
  integration:
    name: Integration
    needs: musl
    runs-on: vault-share-unsealer-runner
    timeout-minutes: 10
    container:
      image: hashicorp/vault:2.1.2@sha256:c2f666266f383d2cf424d86b8bb8ce7d065562173ffec2b476d762943608bb55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration
          path: /tmp/it
      - run: chmod +x /tmp/it/vault-share-unsealer
      - run: sh tests/integration.sh
        env:
          VSU_BIN: /tmp/it/vault-share-unsealer
          CERT_DIR: /tmp/it/certs
  release:
    name: Release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, musl, integration]
    uses: bl4ko/shared-actions/.github/workflows/release.yml@989cf8d2361c3d4d943055c6f2f1bf5c493c287a # main
    with:
      runs-on: vault-share-unsealer-runner
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
