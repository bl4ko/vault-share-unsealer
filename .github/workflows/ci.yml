name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    name: Check
    runs-on: vault-share-unsealer-runner
    timeout-minutes: 30
    container:
      image: rust:1.99.0-trixie@sha256:6ff07edce8775d0f64be7aba9197229407301bddf2054d62c27b541a6238a181
    env:
      CARGO_HOME: /tmp/cargo
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  musl:
    name: Musl build
    runs-on: vault-share-unsealer-runner
    timeout-minutes: 30
    container:
      image: ghcr.io/rust-cross/cargo-zigbuild:0.23.4@sha256:d8313491ec5798de0633fdc1c5753761bff79967bea69076020dc78121b2cca8
    env:
      CARGO_HOME: /tmp/cargo
      HOME: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cargo zigbuild --locked --release -j 2 --target x86_64-unknown-linux-musl
      - run: cargo zigbuild --locked --release -j 2 --target aarch64-unknown-linux-musl
      - run: |
          mkdir -p /tmp/it
          cp target/x86_64-unknown-linux-musl/release/vault-share-unsealer /tmp/it/
          sh tests/gen-certs.sh /tmp/it/certs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration
          path: /tmp/it
          retention-days: 1
  integration:
    name: Integration
    needs: musl
    runs-on: vault-share-unsealer-runner
    timeout-minutes: 10
    container:
      image: hashicorp/vault:2.1.2@sha256:c2f666266f383d2cf424d86b8bb8ce7d065562173ffec2b476d762943608bb55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration
          path: /tmp/it
      - run: chmod +x /tmp/it/vault-share-unsealer
      - run: sh tests/integration.sh
        env:
          VSU_BIN: /tmp/it/vault-share-unsealer
          CERT_DIR: /tmp/it/certs
  release:
    name: Release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, musl, integration]
    uses: bl4ko/shared-actions/.github/workflows/release.yml@989cf8d2361c3d4d943055c6f2f1bf5c493c287a # main
    with:
      runs-on: vault-share-unsealer-runner
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
